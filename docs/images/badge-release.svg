<svg xmlns="http://www.w3.org/2000/svg" width="146" height="37" viewBox="0 0 146 37" role="img" aria-label="release v1.0.2">
  <title>release v1.0.2</title>
  <!-- 3D button for the README, made by tools/make_badges.py. JetBrains Mono subset: SIL Open Font License 1.1, (c) The JetBrains Mono Project Authors -->
  <style>
    @font-face { font-family: "JBM"; font-weight: 700; src: url(data:font/woff;base64,) format("woff"); }
    .top { transform: translateY(-2.6px); transition: transform .1s ease;
            animation: press 5s ease-in-out 0.0s infinite; }
    @keyframes press { 0%, 72% { transform: translateY(-2.6px); } 80%, 86% { transform: translateY(-4.3px); }
                        89% { transform: translateY(0); } 94%, 100% { transform: translateY(-2.6px); } }
    @media (prefers-reduced-motion: reduce) { .top { animation: none; } }
    svg:hover .top { animation: none; transform: translateY(-4.3px); }
    svg:active .top { animation: none; transform: translateY(0); }
    svg { cursor: pointer; }
    text { font-size: 13px; font-weight: bold; fill: #fff; }
    .l { font-family: Verdana, Geneva, "DejaVu Sans", sans-serif; }
    .v { font-family: "JBM", "JetBrains Mono", Consolas, monospace; }
  </style>
  <defs><clipPath id="face"><rect x="1" y="6" width="144" height="30" rx="10.5"/></clipPath></defs>
  <rect x="1" y="6" width="144" height="30" rx="10.5" fill="#14532d"/>
  <g class="top">
    <g clip-path="url(#face)">
      <rect x="1" y="6" width="75" height="30" fill="#555"/>
      <rect x="76" y="6" width="69" height="30" fill="#22c55e"/>
    </g>
    <rect x="2" y="7" width="142" height="28" rx="9.5" fill="none" stroke="#14532d" stroke-width="2"/>
    <text class="l" x="40.6" y="25.7" text-anchor="middle">release</text>
    <text class="v" x="110.5" y="25.7" text-anchor="middle" textLength="46.8">v1.0.2</text>
  </g>
</svg>
