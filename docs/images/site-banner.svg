<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="330" viewBox="0 0 1280 330" role="img" aria-label="DeskMate: turn an old Android phone into a desk panel for your Windows PC">
  <title>DeskMate: turn an old Android phone into a desk panel for your Windows PC</title>
  <!-- JetBrains Mono subset: SIL Open Font License 1.1, (c) The JetBrains Mono Project Authors -->
  <style>
    @font-face{font-family:"JBM";font-weight:400;src:url(data:font/woff;base64,) format("woff")}
    @font-face{font-family:"JBM";font-weight:800;src:url(data:font/woff;base64,) format("woff")}
    text { font-family: "JBM", "JetBrains Mono", Consolas, monospace; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    
    .a { animation: driftA 14s ease-in-out infinite alternate; }
    .b { animation: driftB 18s ease-in-out infinite alternate; }
    .c { animation: driftC 16s ease-in-out infinite alternate; }
    @keyframes driftA { to { transform: translate(140px, 40px); } }
    @keyframes driftB { to { transform: translate(-160px, -30px); } }
    @keyframes driftC { to { transform: translate(-80px, 50px); } }
    .dot { animation: blink 2.4s ease-in-out infinite; }
    @keyframes blink { 50% { opacity: .25; } }
  </style>
  <defs>
    <linearGradient id="title" x1="0" x2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#bfdbfe"/><stop offset="1" stop-color="#86efac"/></linearGradient>
    <radialGradient id="orbA"><stop offset="0" stop-color="#2563eb" stop-opacity=".55"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbB"><stop offset="0" stop-color="#22c55e" stop-opacity=".35"/><stop offset="1" stop-color="#22c55e" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbC"><stop offset="0" stop-color="#ff4655" stop-opacity=".25"/><stop offset="1" stop-color="#ff4655" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern>
    <clipPath id="card"><rect x="1" y="1" width="1278" height="328" rx="28"/></clipPath></defs>
  <g clip-path="url(#card)"><rect width="1280" height="330" fill="#0d1117"/><circle class="a" cx="260" cy="90" r="330" fill="url(#orbA)"/><circle class="b" cx="1060" cy="330" r="320" fill="url(#orbB)"/><circle class="c" cx="980" cy="40" r="240" fill="url(#orbC)"/><rect width="1280" height="330" fill="url(#grid)"/></g>
  <rect x="1" y="1" width="1278" height="328" rx="28" fill="none" stroke="#263042" stroke-width="2"/>
  <rect x="465.2" y="62" width="349.6" height="38" rx="19" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".14"/>
  <circle class="dot" cx="489.2" cy="81" r="5" fill="#22c55e"/>
  <text x="507.2" y="87" font-size="17" font-weight="400" fill="#c9d4e2" text-anchor="start" >Windows PC  +  Android phone</text>
  <text x="640.0" y="205" font-size="104" font-weight="800" fill="url(#title)" text-anchor="middle" >DeskMate</text>
  <text x="640.0" y="258" font-size="24" font-weight="400" fill="#c9d4e2" text-anchor="middle" >Turn an old Android phone into a desk panel for your PC.</text>
</svg>
