  <rect x="434.3333333333333" y="1" width="411.3333333333333" height="326" rx="24" fill="none" stroke="#263042" stroke-width="1.5"/>
  <rect class="glow" style="animation-delay:0.5s" x="434.3333333333333" y="1" width="411.3333333333333" height="326" rx="24" fill="none" stroke="#a78bfa" stroke-opacity=".7" stroke-width="2"/>
  <text x="466.3333333333333" y="79" font-size="56" font-weight="800" fill="#a78bfa" text-anchor="start" >02</text>
  <rect x="749.6666666666666" y="33" width="64" height="64" rx="14" fill="#a78bfa" fill-opacity=".14" stroke="#a78bfa" stroke-opacity=".45"/>
  <path d="M8 2h8a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zM11 18h2" transform="translate(763.1066666666667 46.44) scale(1.5466666666666666)" fill="none" stroke="#a78bfa" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" style="stroke-width:2.6px"/>
  <text x="466.3333333333333" y="151" font-size="30" font-weight="700" fill="#f0f6fc" text-anchor="start" >USB debugging</text>
  <text x="466.3333333333333" y="197" font-size="22" font-weight="400" fill="#9aa7b8" text-anchor="start" >Tap Build number 7 times,</text>
  <text x="466.3333333333333" y="229" font-size="22" font-weight="400" fill="#9aa7b8" text-anchor="start" >then turn on USB debugging</text>
  <text x="466.3333333333333" y="261" font-size="22" font-weight="400" fill="#9aa7b8" text-anchor="start" >in Developer options.</text>
  <rect x="867.6666666666666" y="1" width="411.3333333333333" height="326" rx="24" fill="#111827"/>
  <rect x="867.6666666666666" y="1" width="411.3333333333333" height="326" rx="24" fill="url(#g2)"/>
  <rect x="867.6666666666666" y="1" width="411.3333333333333" height="326" rx="24" fill="none" stroke="#263042" stroke-width="1.5"/>
  <rect class="glow" style="animation-delay:1.0s" x="867.6666666666666" y="1" width="411.3333333333333" height="326" rx="24" fill="none" stroke="#22c55e" stroke-opacity=".7" stroke-width="2"/>
  <text x="899.6666666666666" y="79" font-size="56" font-weight="800" fill="#22c55e" text-anchor="start" >03</text>
  <rect x="1183.0" y="33" width="64" height="64" rx="14" fill="#22c55e" fill-opacity=".14" stroke="#22c55e" stroke-opacity=".45"/>
  <path d="M12 2v14M9 5l3-3 3 3M7 9v3l5 3 5-3V8M7 9h.01M17 8h.01M12 16a2 2 0 1 0 0 4 2 2 0 0 0 0-4z" transform="translate(1196.44 46.44) scale(1.5466666666666666)" fill="none" stroke="#22c55e" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke" style="stroke-width:2.6px"/>
  <text x="899.6666666666666" y="151" font-size="30" font-weight="700" fill="#f0f6fc" text-anchor="start" >Plug it in</text>
  <text x="899.6666666666666" y="197" font-size="22" font-weight="400" fill="#9aa7b8" text-anchor="start" >Allow USB debugging on the</text>
  <text x="899.6666666666666" y="229" font-size="22" font-weight="400" fill="#9aa7b8" text-anchor="start" >phone. DeskMate installs</text>
  <text x="899.6666666666666" y="261" font-size="22" font-weight="400" fill="#9aa7b8" text-anchor="start" >the app and opens the</text>
  <text x="899.6666666666666" y="293" font-size="22" font-weight="400" fill="#9aa7b8" text-anchor="start" >panel.</text>
