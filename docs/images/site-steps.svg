  <defs><linearGradient id="g0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb" stop-opacity=".16"/><stop offset=".6" stop-color="#2563eb" stop-opacity="0"/></linearGradient><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa" stop-opacity=".16"/><stop offset=".6" stop-color="#a78bfa" stop-opacity="0"/></linearGradient><linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22c55e" stop-opacity=".16"/><stop offset=".6" stop-color="#22c55e" stop-opacity="0"/></linearGradient></defs>
