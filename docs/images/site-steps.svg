  <text x="33.0" y="79" font-size="56" font-weight="800" fill="#2563eb" text-anchor="start" >01</text>
  <rect x="316.3333333333333" y="33" width="64" height="64" rx="14" fill="#2563eb" fill-opacity=".14" stroke="#2563eb" stroke-opacity=".45"/>
  <path d="M12,16L7,11L8.4,9.55l2.6,2.6V4h2v8.15l2.6-2.6L17,11l-5,5ZM6,20q-0.82,0-1.41-0.59T4,18V15H6v3H18V15h2v3q0,0.82-0.59,1.41T18,20H6Z" transform="translate(329.13 45.80) scale(1.6000)" fill="#2563eb"/>
  <text x="33.0" y="151" font-size="30" font-weight="700" fill="#f0f6fc" text-anchor="start" >Download</text>
  <text x="33.0" y="197" font-size="22" font-weight="400" fill="#9aa7b8" text-anchor="start" >Open DeskmateAgent.exe. It</text>
  <text x="33.0" y="229" font-size="22" font-weight="400" fill="#9aa7b8" text-anchor="start" >installs itself and starts</text>
  <text x="33.0" y="261" font-size="22" font-weight="400" fill="#9aa7b8" text-anchor="start" >with Windows.</text>
  <rect x="434.3333333333333" y="1" width="411.3333333333333" height="326" rx="24" fill="#111827"/>
